name: Build OrbitalStrike JAR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build JAR
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalStrike-Fabric-26.2
          path: build/libs/*.jar
          
